<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object Oriented JavaScript</title>
  </head>
  <body>
    <h1>Object oriented JavaScript</h1>
    <script>
      "use strict";
      // Creating a constructor function named as Person for person object
      function Person(name, age, email, eyecolor) {
        this.name = name;
        this.age = age;
        this.email = email;
        this.eyecolor = eyecolor;

        return this;
      }

      const myself = new Person(
        "Siddhesh",
        25,
        "siidjadhav@gmail.com",
        "black",
      );
      const myGf = new Person("Khushi", 21, "kvishwakarma@gmail.com", "black");

      // Person.nationality = "American" Note: You can't add properties to constructor like this.
      // const random = new Person('John',10,'xyz@gmail.com','blue','american')

      // console.log(random);
      console.log(myself);
      console.log(myGf);

      // Prototype

      // const myName = "Siddhesh Jadhav"
      // const myName = new String("Ironman");
      // console.log(myName);

      // const p1 = {
      //   fname: "Siddhesh",
      //   laname: "Jadhav",
      // };
      // console.log(p1);

      // const p2 = Object.create(p1)
      // console.log(p2);


      // We've to learn - __proto__, object.setPrototype and constructor.prototype.yourMethod



      // Classes, objects and inheritance

      let car = {
        make: "Toyota",
        model: "Camry",
        year: 2020,
        start: function (param){
          return `${this.make} started in ${this.year}`
        }
      }
      console.log(car.start());

      // Constructor fn
      function Person(name,age){
        this.name = name
        this.age = age
      }
      // Object created based on constructor function
      let jack = new Person('Jack',39)
      console.log(jack);

      // another constructor fn
      function Animal(type){
        this.type = type
      }

      // Adding a method inside a constructor function using prototype
      Animal.prototype.speak = function(){
        return `${this.type} speaks`
      }
      // Adding a new method inside a Array object's prototype
      Array.prototype.siddhesh = function(){
        return `Custom method ${this}`
      }

      let myArray = [1,2,3]
      console.log(myArray.siddhesh());

      // Creating classes

      class IceCream{
        constructor(flavor,brand){
          this.flavor = flavor
          this.brand = brand
        }

        order(){
          return `An ice-cream with ${this.flavor} flavor of ${this.brand} brand.`
        }

        extras(){
          return `Add some sprinklers to ${this.flavor} ice cream.`
        }
      }

      // Inheritance
      // What i want is my Food class should inherit properties and methods of IceCream class
      class Food extends IceCream{
        drive(){
          return `${this.flavor} is inherited inside Food from IceCream`
        }
      }
      // Creating object out of classes

      let myIceCream = new IceCream('Vannila','Amul')
      console.log(myIceCream.order());
      console.log(myIceCream.flavor);

      let myFood = new Food('Chocolate','Magnum')
      console.log(myFood.extras());
    </script>
  </body>
</html>
